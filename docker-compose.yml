services:
  feeds-runner:
    build: .
    container_name: feeds-runner
    env_file:
      - .env
    environment:
      - TZ=Europe/Kyiv
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    command: ["sh", "-lc", "sleep infinity"]
    restart: unless-stopped
    labels:
      - "traefik.enable=false"
      - "ofelia.enabled=true"
      # робимо 6-польовий cron (sec min hour dom mon dow): щодня 00:05–00:15
      - "ofelia.job-exec.lispo.schedule=0 5 0 * * *"
      - "ofelia.job-exec.lispo.command=sh -lc 'node services/run-service.mjs services/lispo.json; code=$$?; if [ $$code -eq 0 ]; then wget -qO- \"https://status.workflo.space/api/push/OzF3oV9VSw?status=up&msg=OK&ping=\" >/dev/null; else wget -qO- \"https://status.workflo.space/api/push/OzF3oV9VSw?status=down&msg=FAIL&ping=\" >/dev/null; fi; exit $$code'"
      - "ofelia.job-exec.clsport.schedule=0 6 0 * * *"
      - "ofelia.job-exec.clsport.command=sh -lc 'node services/run-service.mjs services/clsport.json; code=$$?; if [ $$code -eq 0 ]; then wget -qO- \"https://status.workflo.space/api/push/JgIPE6I5H2?status=up&msg=OK&ping=\" >/dev/null; else wget -qO- \"https://status.workflo.space/api/push/JgIPE6I5H2?status=down&msg=FAIL&ping=\" >/dev/null; fi; exit $$code'"
      - "ofelia.job-exec.gorgany_alpha.schedule=0 7 0 * * *"
      - "ofelia.job-exec.gorgany_alpha.command=sh -lc 'node services/run-service.mjs services/gorgany_alpha.json; code=$$?; if [ $$code -eq 0 ]; then wget -qO- \"https://status.workflo.space/api/push/gZf0qECvmI?status=up&msg=OK&ping=\" >/dev/null; else wget -qO- \"https://status.workflo.space/api/push/gZf0qECvmI?status=down&msg=FAIL&ping=\" >/dev/null; fi; exit $$code'"
      - "ofelia.job-exec.lekos.schedule=0 8 0 * * *"
      - "ofelia.job-exec.lekos.command=sh -lc 'node services/run-service.mjs services/lekos.json; code=$$?; if [ $$code -eq 0 ]; then wget -qO- \"https://status.workflo.space/api/push/N1kyaEQFBO?status=up&msg=OK&ping=\" >/dev/null; else wget -qO- \"https://status.workflo.space/api/push/N1kyaEQFBO?status=down&msg=FAIL&ping=\" >/dev/null; fi; exit $$code'"
      - "ofelia.job-exec.og_shop.schedule=0 9 0 * * *"
      - "ofelia.job-exec.og_shop.command=sh -lc 'node services/run-service.mjs services/og_shop.json; code=$$?; if [ $$code -eq 0 ]; then wget -qO- \"https://status.workflo.space/api/push/bwSm9221oi?status=up&msg=OK&ping=\" >/dev/null; else wget -qO- \"https://status.workflo.space/api/push/bwSm9221oi?status=down&msg=FAIL&ping=\" >/dev/null; fi; exit $$code'"
      - "ofelia.job-exec.roksana_shop.schedule=0 10 0 * * *"
      - "ofelia.job-exec.roksana_shop.command=sh -lc 'node services/run-service.mjs services/roksana_shop.json; code=$$?; if [ $$code -eq 0 ]; then wget -qO- \"https://status.workflo.space/api/push/m3gaKHNfDc?status=up&msg=OK&ping=\" >/dev/null; else wget -qO- \"https://status.workflo.space/api/push/m3gaKHNfDc?status=down&msg=FAIL&ping=\" >/dev/null; fi; exit $$code'"
      - "ofelia.job-exec.niala.schedule=0 11 0 * * *"
      - "ofelia.job-exec.niala.command=sh -lc 'node services/run-service.mjs services/niala.json; code=$$?; if [ $$code -eq 0 ]; then wget -qO- \"https://status.workflo.space/api/push/pStJOiLW3w?status=up&msg=OK&ping=\" >/dev/null; else wget -qO- \"https://status.workflo.space/api/push/pStJOiLW3w?status=down&msg=FAIL&ping=\" >/dev/null; fi; exit $$code'"
      - "ofelia.job-exec.atlantmarket.schedule=0 12 0 * * *"
      - "ofelia.job-exec.atlantmarket.command=sh -lc 'node services/run-service.mjs services/atlantmarket.json; code=$$?; if [ $$code -eq 0 ]; then wget -qO- \"https://status.workflo.space/api/push/DFNM6zIb35?status=up&msg=OK&ping=\" >/dev/null; else wget -qO- \"https://status.workflo.space/api/push/DFNM6zIb35?status=down&msg=FAIL&ping=\" >/dev/null; fi; exit $$code'"
      - "ofelia.job-exec.markshop.schedule=0 13 0 * * *"
      - "ofelia.job-exec.markshop.command=sh -lc 'node services/run-service.mjs services/markshop.json; code=$$?; if [ $$code -eq 0 ]; then wget -qO- \"https://status.workflo.space/api/push/wibOIypj0X?status=up&msg=OK&ping=\" >/dev/null; else wget -qO- \"https://status.workflo.space/api/push/wibOIypj0X?status=down&msg=FAIL&ping=\" >/dev/null; fi; exit $$code'"
      - "ofelia.job-exec.powerplay.schedule=0 14 0 * * *"
      - "ofelia.job-exec.powerplay.command=sh -lc 'node services/run-service.mjs services/powerplay.json; code=$$?; if [ $$code -eq 0 ]; then wget -qO- \"https://status.workflo.space/api/push/3hBBC8fLUc?status=up&msg=OK&ping=\" >/dev/null; else wget -qO- \"https://status.workflo.space/api/push/3hBBC8fLUc?status=down&msg=FAIL&ping=\" >/dev/null; fi; exit $$code'"
      - "ofelia.job-exec.rabona.schedule=0 15 0 * * *"
      - "ofelia.job-exec.rabona.command=sh -lc 'node services/run-normalize-sheet.mjs services/rabona.json; code=$$?; if [ $$code -eq 0 ]; then wget -qO- \"https://status.workflo.space/api/push/67vFtA8We9?status=up&msg=OK&ping=\" >/dev/null; else wget -qO- \"https://status.workflo.space/api/push/67vFtA8We9?status=down&msg=FAIL&ping=\" >/dev/null; fi; exit $$code'"

  ofelia:
    image: mcuadros/ofelia:0.3.13
    container_name: ofelia
    depends_on:
      - feeds-runner
    environment:
      - TZ=Europe/Kyiv
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    command: daemon --docker
    restart: unless-stopped
    labels:
      - "traefik.enable=false"
