services:
  feeds-runner:
    build: .
    container_name: feeds-runner
    env_file:
      - .env
    environment:
      - TZ=Europe/Kyiv
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    command: ["sh", "-lc", "sleep infinity"]
    restart: unless-stopped
    labels:
      - "traefik.enable=false"
      - "ofelia.enabled=true"
      # 4 запуски на добу (Europe/Kyiv): 00:00, 06:00, 12:00, 18:00
      - "ofelia.job-exec.feeds-0000.schedule=0 0 0 * * *"
      - "ofelia.job-exec.feeds-0000.command=sh -lc 'node services/run-all.mjs'"
      - "ofelia.job-exec.feeds-0600.schedule=0 0 6 * * *"
      - "ofelia.job-exec.feeds-0600.command=sh -lc 'node services/run-all.mjs'"
      - "ofelia.job-exec.feeds-1200.schedule=0 0 12 * * *"
      - "ofelia.job-exec.feeds-1200.command=sh -lc 'node services/run-all.mjs'"
      - "ofelia.job-exec.feeds-1800.schedule=0 0 18 * * *"
      - "ofelia.job-exec.feeds-1800.command=sh -lc 'node services/run-all.mjs'"

  ofelia:
    image: mcuadros/ofelia:0.3.13
    container_name: ofelia
    depends_on:
      - feeds-runner
    environment:
      - TZ=Europe/Kyiv
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    command: daemon --docker
    restart: unless-stopped
    labels:
      - "traefik.enable=false"
